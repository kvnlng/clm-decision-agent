[project]
name = "clm-decision-agent"
version = "0.1.0"
description = "A framework for decision servers: checkable decisions offered to agents over MCP"
requires-python = ">=3.12,<3.15"          # torch has no wheels for 3.15 yet
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
# The core serves environments (graph, DMN, calculations, scenarios), with keys or OAuth, and writes registry entries
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28.1",
    "httpx2>=2.10.0",                     # connection.py builds the client's timeout with it
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
    "numpy",
]

[project.optional-dependencies]
# CLM: scenarios, judges, training, and the language models that write examples
clm = [
    # MLX runs only on Apple Silicon Macs; elsewhere CLM runs with torch
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.4",
    "safetensors",
    "transformers>=5.18.0",
    "huggingface_hub",
    "langchain-core>=1.6.6,<2",
    "langchain-ollama>=1.1.0,<2",
    "langchain-openai>=1.6.7",
]
neo4j = ["neo4j>=6,<7"]
# Collections of documents in PostgreSQL with pgvector
documents = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
# The reference agent with Claude; with Ollama it needs nothing more
agent = ["anthropic>=2.1.0,<3"]

[project.scripts]
clm-server = "clm_decision.server:main"
clm-agent = "clm_decision.decision_agent:main"
clm-new-scenario = "clm_decision.new_scenario:main"
clm-new-environment = "clm_decision.new_environment:main"
clm-train = "clm_decision.train:main"
clm-evaluate = "clm_decision.evaluate:main"
clm-synthesize = "clm_decision.synthesize:main"
clm-record = "clm_decision.record:main"
clm-load-graph = "clm_decision.load_graph:main"
clm-load-documents = "clm_decision.load_documents:main"
clm-registry = "clm_decision.registry:main"
clm-trace-report = "clm_decision.trace_report:main"
clm-derive = "clm_decision.derive:main"

[dependency-groups]
# A checkout gets every extra, so `uv sync` and the tests have everything
dev = [
    "clm-decision-agent[clm,neo4j,documents,agent]",
    "pylint>=4.1.2",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clm_decision"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models",
           "postgres: needs a local PostgreSQL with pgvector (CLM_TEST_POSTGRES_PASSWORD set)"]
addopts = "-m 'not slow and not postgres'"

[tool.pylint.main]
# Vendored unchanged from the CLM authors, so it keeps their style
ignore = ["clm_schema.py"]
# The tests import their shared helpers (conftest, routing_cases) the way pytest does
init-hook = "import sys; sys.path[:0] = ['src', 'tests', 'examples/service_desk', 'examples/crowdstrike', 'examples/noncompete']"

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Small classes with one public method are deliberate here (generator backends, test fakes)
disable = ["too-few-public-methods"]
