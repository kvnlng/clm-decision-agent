[project]
name = "clm-agent"
version = "0.1.0"
description = "Local chat agent: CLM decides, a generator writes, LangGraph connects them"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.32",
    "mlx-lm>=0.32.0",
    "transformers>=5.18.0",
    "huggingface_hub",
    "langgraph>=1.2.12,<2",
    "langchain-core>=1.6.6,<2",
    "langchain-ollama>=1.1.0,<2",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.7",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pylint>=4.1.2",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: loads real models"]
addopts = "-m 'not slow'"

[tool.pylint.main]
# The tests import their shared helpers (conftest, routing_cases) the way pytest does
init-hook = "import sys; sys.path[:0] = ['tests', 'examples/service_desk']"

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Small classes with one public method are deliberate here (generator backends, test fakes)
disable = ["too-few-public-methods"]
