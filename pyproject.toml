[project]
name = "clm-decision-agent"
version = "0.1.0"
description = "A decision server: CLM makes a scenario's decisions and offers them to agents over MCP"
requires-python = ">=3.12,<3.15"          # torch has no wheels for 3.15 yet
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # MLX runs only on Apple Silicon Macs; elsewhere CLM runs with torch
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.4",
    "numpy",
    "safetensors",
    "transformers>=5.18.0",
    "huggingface_hub",
    "langchain-core>=1.6.6,<2",
    "langchain-ollama>=1.1.0,<2",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.7",
    "cryptography>=50.0.2",
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
demo = [
    "anthropic>=2.1.0,<3",
]
dev = [
    "pylint>=4.1.2",
    "pytest>=8",
]
graph = [
    "neo4j>=6,<7",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clm_decision"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models"]
addopts = "-m 'not slow'"

[tool.pylint.main]
# Vendored unchanged from the CLM authors, so it keeps their style
ignore = ["clm_schema.py"]
# The tests import their shared helpers (conftest, routing_cases) the way pytest does
init-hook = "import sys; sys.path[:0] = ['src', 'tests', 'examples/service_desk', 'examples/crowdstrike']"

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Small classes with one public method are deliberate here (generator backends, test fakes)
disable = ["too-few-public-methods"]
