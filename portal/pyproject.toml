[project]
name = "clm-portal"
version = "0.1.0"
description = "The portal: a local page for administering a decision server, and a command-line chat with any server."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
# The main package brings mcp, httpx, starlette, uvicorn and python-multipart, and its clm-server, clm-load-documents
# and clm-derive scripts; its agent extra brings anthropic, for --backend claude, and neo4j lets the portal's own
# server reach a graph in Neo4j
dependencies = [
    "clm-decision-agent[documents,agent,neo4j]",
]

[project.scripts]
clm-portal = "clm_portal:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
clm-decision-agent = { path = "..", editable = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clm_portal"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
