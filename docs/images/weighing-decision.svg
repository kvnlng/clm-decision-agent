<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" width="1020" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One weighing decision: the agent reads describe and asks for a scenario; the engine runs each branch through your queries, calculation and limits, rejects or fails branches and ranks the rest; the agent answers from the results and the number check matches its figures</title>
  <style>
    .bg { fill: #ffffff; }
    .agent { fill: #6b6b6b; }
    .clm { fill: #2f6db3; }
    .yours { fill: #2e7d4f; }
    .reject { fill: #8a3b3b; }
    .conflict { fill: #8f5410; }
    .name { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .sub { fill: #ffffff; font-size: 13px; }
    .note { fill: #fff6d6; stroke: #d4a72c; }
    .ntext { fill: #1f2328; font-size: 13px; }
    .line { stroke: #6b6b6b; stroke-width: 1.6; fill: none; }
    .dash { stroke-dasharray: 6 4; }
    .life { stroke: #9a9a9a; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
    .frame { stroke: #8a8a8a; stroke-width: 1.2; fill: none; }
    .head, .dot { fill: #6b6b6b; }
    .label { fill: #444444; font-size: 13px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .strong { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .note { fill: #2e2408; stroke: #9e6a03; }
      .ntext { fill: #e6edf3; }
      .line { stroke: #9198a1; }
      .life, .frame { stroke: #6e7681; }
      .head, .dot { fill: #9198a1; }
      .label { fill: #c9d1d9; stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1020" height="760" rx="12"/>
  <path class="life" d="M140,84 L140,736"/>
  <path class="life" d="M400,84 L400,736"/>
  <path class="life" d="M640,84 L640,736"/>
  <path class="life" d="M880,84 L880,736"/>
  <rect class="agent" x="40" y="24" width="200" height="60" rx="8"/>
  <text class="name" x="140" y="49.5" text-anchor="middle">Agent</text>
  <text class="sub" x="140" y="69.5" text-anchor="middle">any MCP client</text>
  <rect class="clm" x="300" y="24" width="200" height="60" rx="8"/>
  <text class="name" x="400" y="49.5" text-anchor="middle">MCP server</text>
  <text class="sub" x="400" y="69.5" text-anchor="middle">the environment's tools</text>
  <rect class="clm" x="540" y="24" width="200" height="60" rx="8"/>
  <text class="name" x="640" y="49.5" text-anchor="middle">Engine</text>
  <text class="sub" x="640" y="69.5" text-anchor="middle">engine.py</text>
  <rect class="yours" x="780" y="24" width="200" height="60" rx="8"/>
  <text class="name" x="880" y="49.5" text-anchor="middle">Your parts</text>
  <text class="sub" x="880" y="69.5" text-anchor="middle">queries, rules, calculations</text>
  <path class="line" d="M140,128 L399,128" marker-end="url(#arrow)"/>
  <text class="label" x="270" y="120" text-anchor="middle">describe</text>
  <path class="line dash" d="M400,164 L141,164" marker-end="url(#arrow)"/>
  <text class="label" x="270" y="156" text-anchor="middle">parts, parameters, levers, limits</text>
  <path class="line" d="M140,212 L399,212" marker-end="url(#arrow)"/>
  <text class="label" x="270" y="204" text-anchor="middle">scenario_&lt;name&gt;(parameters)</text>
  <path class="line" d="M400,248 L639,248" marker-end="url(#arrow)"/>
  <text class="label" x="520" y="240" text-anchor="middle">run the branches</text>
  <rect class="frame" x="592" y="272" width="388" height="176" rx="4"/>
  <text class="label strong" x="604" y="290" text-anchor="start">loop: each lever combination</text>
  <path class="line" d="M640,320 L879,320" marker-end="url(#arrow)"/>
  <text class="label" x="760" y="312" text-anchor="middle">query, calculate</text>
  <path class="line dash" d="M880,352 L641,352" marker-end="url(#arrow)"/>
  <text class="label" x="760" y="344" text-anchor="middle">rows, figures</text>
  <path class="line" d="M640,396 L879,396" marker-end="url(#arrow)"/>
  <text class="label" x="760" y="388" text-anchor="middle">check each limit</text>
  <path class="line dash" d="M880,428 L641,428" marker-end="url(#arrow)"/>
  <text class="label" x="760" y="420" text-anchor="middle">allowed or not, reason</text>
  <path class="note" d="M510,468 L756,468 L770,482 L770,540 L510,540 Z"/>
  <text class="ntext" x="522" y="491.5">Reject a branch over a limit; fail</text>
  <text class="ntext" x="522" y="508.5">one that skipped a limit or step;</text>
  <text class="ntext" x="522" y="525.5">rank the rest by the objective</text>
  <path class="line dash" d="M640,576 L401,576" marker-end="url(#arrow)"/>
  <text class="label" x="520" y="568" text-anchor="middle">every branch and its steps</text>
  <path class="line dash" d="M400,612 L141,612" marker-end="url(#arrow)"/>
  <text class="label" x="270" y="604" text-anchor="middle">figures, status, rejecting limits</text>
  <path class="note" d="M24,640 L310,640 L324,654 L324,712 L24,712 Z"/>
  <text class="ntext" x="36" y="663.5">The agent answers from the results and</text>
  <text class="ntext" x="36" y="680.5">never calculates; the number check</text>
  <text class="ntext" x="36" y="697.5">matches each figure to a tool result</text>
</svg>
