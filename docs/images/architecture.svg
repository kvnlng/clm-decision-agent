<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Any MCP agent calls clm-server, which serves a scenario or an environment</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .server { fill: #ddf4ff; stroke: #54aeff; }
    .scenario { fill: #fff8c5; stroke: #d4a72c; }
    .environment { fill: #dafbe1; stroke: #4ac26b; }
    .title { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .text { fill: #1f2328; font-size: 13.5px; }
    .muted { fill: #59636e; font-size: 13px; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .head { fill: #59636e; }
    .label { fill: #59636e; font-size: 12.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .server { fill: #0c2d4a; stroke: #1f6feb; }
      .scenario { fill: #2e2408; stroke: #9e6a03; }
      .environment { fill: #0f2d1a; stroke: #238636; }
      .title, .text { fill: #e6edf3; }
      .muted, .label { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="330" rx="12"/>

  <!-- The agent -->
  <rect class="box" x="24" y="120" width="190" height="96" rx="10"/>
  <text class="title" x="119" y="152" text-anchor="middle">Any MCP agent</text>
  <text class="muted" x="119" y="176" text-anchor="middle">Claude, a local model,</text>
  <text class="muted" x="119" y="195" text-anchor="middle">Databricks</text>

  <!-- MCP, both ways -->
  <path class="line" d="M214,168 L286,168" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="250" y="158" text-anchor="middle">MCP</text>

  <!-- The server -->
  <rect class="server" x="288" y="128" width="150" height="80" rx="10"/>
  <text class="title" x="363" y="164" text-anchor="middle">clm-server</text>
  <text class="muted" x="363" y="186" text-anchor="middle">serves one of</text>

  <!-- Branches -->
  <path class="line" d="M438,152 C470,152 470,82 500,82" marker-end="url(#arrow)"/>
  <path class="line" d="M438,184 C470,184 470,248 500,248" marker-end="url(#arrow)"/>

  <!-- Scenario -->
  <rect class="scenario" x="502" y="24" width="394" height="116" rx="10"/>
  <text class="title" x="520" y="52">A scenario</text>
  <text class="muted" x="880" y="52" text-anchor="end">scenario.toml</text>
  <text class="text" x="520" y="78">Which route a message takes, quickly and many at once</text>
  <text class="text" x="520" y="102">• CLM: MLX on a Mac, PyTorch on a GPU</text>
  <text class="text" x="520" y="124">• informing and acting tools</text>

  <!-- Environment -->
  <rect class="environment" x="502" y="160" width="394" height="148" rx="10"/>
  <text class="title" x="520" y="188">An environment</text>
  <text class="muted" x="880" y="188" text-anchor="end">environment.toml</text>
  <text class="text" x="520" y="214">Questions on an organisation's data, arithmetic and policy</text>
  <text class="text" x="520" y="238">• a graph (built in, or Neo4j) and DMN rules</text>
  <text class="text" x="520" y="260">• calculations and scenarios of levers</text>
  <text class="text" x="520" y="282">• judges: CLM, loaded on the first judgement</text>
</svg>
