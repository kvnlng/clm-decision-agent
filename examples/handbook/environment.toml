# A made-up company's employee handbook: an employee's questions about the 401(k) match, leave, parental leave,
# tuition and dress code, answered from Meridian's rules and its handbook (README.md). Not HR, tax or legal advice.
# docs/environment.md explains every part.

[environment]
name = "Employee handbook"
description = """NOT HR, TAX OR LEGAL ADVICE: Meridian Logistics, its employees and its handbook are made up. An \
employee's questions about their benefits, answered from Meridian's rules for the employee's own record as of a \
date (give the date as 2026-12-01). The 401(k) company match: run scenario_match. Carrying over unused leave: \
scenario_carryover. Parental leave: scenario_parental_leave, with as_of the day the leave would start. Tuition \
assistance: scenario_tuition. Anything else, such as an office's dress code: search and read the handbook with the \
search_ and document_ tools. Cite the handbook by its section, as returned; an edition with effective_until has \
been replaced."""
functions = "handbook_functions"

[graph]
backend = "builtin"
nodes = "graph/nodes.csv"
edges = "graph/edges.csv"

[documents]
backend = "postgres"
password_env = "CLM_DOCUMENTS_PASSWORD"

[collections.handbook]
description = """Meridian's employee handbook (made up), one document per policy, its numbered parts as passages \
labelled "(1)", "(2)". Replaced editions are kept, with effective_until set."""
embedding_model = "embeddinggemma"
filters = { policy = "string", effective_from = "date", effective_until = "date" }

[queries.employee]
description = "An employee's record as of a date: state, office, hire date, days employed (the first day counts as day 1), full years of service, salary in dollars, 401(k) contribution in percent of pay, and unused leave in days."
params = { employee = "string", as_of = "string" }
function = "employee"

[queries.plan]
description = "The 401(k) plan's 2026 IRS limit on employee contributions and its cap on the company match, in dollars, with the source."
params = {}
function = "plan"

[calculations.company_match]
description = "The company match in dollars a year for a salary and a contribution in percent of pay, capped."
params = { salary = "number", contribution_percent = "number", match_cap = "number" }
function = "company_match"

[calculations.carryover_days]
description = "Of the unused days, after taking some more this year, how many carry over and how many are forfeited."
params = { balance = "number", days_taken = "number", limit = "number" }
function = "carryover_days"

[calculations.leave_pay]
description = "Weekly pay during parental leave at full and reduced pay, and the total for the weeks taken, in dollars."
params = { salary = "number", full_pay_weeks = "number", partial_pay_weeks = "number", partial_pay_percent = "number", weeks_taken = "number" }
function = "leave_pay"

[calculations.reimbursement]
description = "The tuition repaid in dollars: a percentage of it, up to the yearly cap."
params = { tuition = "number", percent = "number", annual_cap = "number" }
function = "reimbursement"

[decisions.match_eligible]
description = "Whether the company match has begun for an employee, from their days of employment."
dmn = "rules/match_eligible.dmn"
collection = "handbook"

[decisions.match_eligible.rule]
statement = "The company match begins on the 90th day of employment."
reason = "The plan's waiting period, as restated on 1 January 2026."
owner = "People Operations (made up)"
version = "2026-01"
governs = ["benefits"]
cites = ["hb-401k-2026"]

[decisions.vesting]
description = "The percentage of the company match an employee owns, from their full years of service."
dmn = "rules/vesting.dmn"
collection = "handbook"

[decisions.vesting.rule]
statement = "The company match vests 25% for each full year of service."
reason = "The plan's vesting schedule, as restated on 1 January 2026."
owner = "People Operations (made up)"
version = "2026-01"
governs = ["benefits"]
cites = ["hb-401k-2026"]

[decisions.carryover_limit]
description = "How many unused days of paid time off carry into next year, from full years of service."
dmn = "rules/carryover_limit.dmn"
collection = "handbook"

[decisions.carryover_limit.rule]
statement = "Up to 7 unused days carry over, or 10 with 5 or more full years of service."
reason = "The paid time off policy."
owner = "People Operations (made up)"
version = "2026-01"
governs = ["benefits"]
cites = ["hb-leave"]

[decisions.parental_eligible]
description = "Whether an employee may start parental leave, and its weeks at full and reduced pay, from days employed on the day it starts."
dmn = "rules/parental_eligible.dmn"
collection = "handbook"

[decisions.parental_eligible.rule]
statement = "Parental leave needs 180 days of employment: 11 weeks at full pay, then up to 4 at 60%."
reason = "The parental leave policy."
owner = "People Operations (made up)"
version = "2026-01"
governs = ["benefits"]
cites = ["hb-parental"]

[decisions.tuition_eligible]
description = "Whether a course's tuition is repaid, the percentage and the yearly cap, from full years of service and whether the course is job-related."
dmn = "rules/tuition_eligible.dmn"
collection = "handbook"

[decisions.tuition_eligible.rule]
statement = "After one full year, 80% of a job-related course's tuition is repaid, up to $4,750 a calendar year."
reason = "The tuition assistance policy."
owner = "People Operations (made up)"
version = "2026-01"
governs = ["benefits"]
cites = ["hb-tuition"]

[scenarios.match]
description = "An employee's 401(k) company match: now, at each contribution rate, and the most it can be; with the match cap, the IRS limit and how much is vested."
params = { employee = "string", as_of = "string" }
levers = { contribution_percent = [3, 4, 5, 6, 8] }
branch = "match"
objective = "match_at_rate"
limits = ["match_eligible"]

[scenarios.carryover]
description = "How many of an employee's unused days carry into next year, and how many are forfeited, if they take this many more days this year."
params = { employee = "string", as_of = "string" }
levers = { days_taken = [0, 2, 5] }
branch = "carryover"
objective = "carried_days"

[scenarios.parental_leave]
description = "Whether an employee may start parental leave on the date, its weeks at full and reduced pay, and the pay for the weeks taken."
params = { employee = "string", as_of = "string" }
levers = { weeks_taken = [11, 15] }
branch = "parental_leave"
objective = "total_pay"
limits = ["parental_eligible"]

[scenarios.tuition]
description = "Whether a course's tuition is repaid, how much, and the yearly cap. Give the tuition in dollars and whether the manager agrees the course is job-related."
params = { employee = "string", as_of = "string", tuition = "number", job_related = "boolean" }
levers = { calendar_year = [2027] }
branch = "tuition"
objective = "reimbursed"
limits = ["tuition_eligible"]
