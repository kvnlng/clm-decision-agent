[project]
name = "clm-test-client"
version = "0.1.0"
description = "A small command-line MCP client, for testing a decision server. Not for production."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Only for --backend claude; any other model needs nothing more
claude = ["anthropic>=2.1.0,<3"]

[project.scripts]
clm-test-client = "clm_test_client:main"

[dependency-groups]
dev = [
    "clm-test-client[claude]",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clm_test_client"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
